[project]
name = "c2-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NayuTW", email = "trevordwilliams10@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
c2-project = "c2_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "c2"
